[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ercot-game"
version = "0.3.0"
description = "Deterministic offline evaluator domain model for the ERCOT data-center competition"
requires-python = ">=3.11"
dependencies = [
    "highspy>=1.8,<2",
]

[project.scripts]
ercot-game-batch = "ercot_game.batch_cli:main"
ercot-game-check-csv = "ercot_game.csv_validator:main"

# The package contains the canonical CSV evaluator and Zenodo DCOPF adapter.
[tool.setuptools]
packages = [
    "ercot_game",
    "tools",
    "tools.zenodo_texas",
]

[tool.setuptools.package-dir]
ercot_game = "src/ercot_game"
tools = "tools"
"tools.zenodo_texas" = "tools/zenodo_texas"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
